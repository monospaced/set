packages:
  - "apps/*"
  - "packages/*"

# Don't install a release until it's had a community soak. 3 days, in
# minutes (pnpm's unit). Mirrored by the Dependabot `cooldown` in
# .github/dependabot.yml so proposals and installs share one policy.
minimumReleaseAge: 4320

catalog:
  "@types/node": ^25.8.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  eslint: ^10.2.1
  jsdom: ^29.1.1
  prettier: ^3.8.3
  react: ^19.2.6
  react-dom: ^19.2.6
  stylelint: ^17.9.0
  typescript: ^5.9.3
  vite: ^8.2.1
  vitest: ^4.1.6
