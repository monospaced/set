packages:
  - "apps/*"
  - "packages/*"

# Don't install a release until it's had a community soak. 3 days, in
# minutes (pnpm's unit). Mirrored by the Dependabot `cooldown` in
# .github/dependabot.yml so proposals and installs share one policy.
minimumReleaseAge: 4320

catalog:
  "@types/node": ^25.8.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  eslint: ^10.8.0
  jsdom: ^29.1.1
  prettier: ^3.8.3
  react: ^19.2.8
  react-dom: ^19.2.8
  stylelint: ^17.14.1
  typescript: ^5.9.3
  vite: ^7.3.2
  vitest: ^4.1.10
