packages:
  - "apps/*"
  - "packages/*"

# Don't install a release until it's had a community soak. 3 days, in
# minutes (pnpm's unit). Mirrored by the Dependabot `cooldown` in
# .github/dependabot.yml so proposals and installs share one policy.
minimumReleaseAge: 4320

# esbuild's postinstall only swaps in a prebuilt binary; the JS fallback is fine.
allowBuilds:
  esbuild: false

catalog:
  "@eslint/js": ^10.0.1
  "@eslint/json": ^2.1.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  eslint: ^10.14.0
  globals: ^17.14.0
  jsdom: ^29.1.1
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  stylelint: ^17.16.0
  typescript: ^5.9.3
  typescript-eslint: ^8.72.1
  vite: ^8.3.6
  vitest: ^5.1.0
