packages:
  - "apps/*"
  - "packages/*"

# Don't install a release until it's had a community soak. 3 days, in
# minutes (pnpm's unit). Mirrored by the Dependabot `cooldown` in
# .github/dependabot.yml so proposals and installs share one policy.
minimumReleaseAge: 4320

catalog:
  "@types/node": ^25.8.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^10.12.0
  jsdom: ^29.1.1
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  stylelint: ^17.16.0
  typescript: ^5.9.3
  vite: ^7.3.2
  vitest: ^4.1.6
