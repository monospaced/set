name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Stylelint
        run: pnpm run stylelint

      - name: Format check
        run: pnpm run format:check

  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require changeset for public package changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          # Only publishable source counts. Stories, tests, and test helpers
          # live under src/ but never ship in dist, so changing them alone
          # must not require a changeset.
          PUBLIC=$(echo "$CHANGED" \
            | grep -E '^packages/(assets|config|core|markdown|react|skills|tokens)/src/' \
            | grep -vE '\.(stories|test|spec)\.[jt]sx?$|(^|/)test/' || true)
          CHANGESET=$(echo "$CHANGED" | grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -n "$PUBLIC" ] && [ -z "$CHANGESET" ]; then
            echo "::error::Public package source changed without a changeset. Run \`pnpm changeset\` and commit the result."
            echo "Changed publishable sources:"
            echo "$PUBLIC"
            exit 1
          fi
          echo "Changeset check: OK"

  system:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate system
        run: pnpm run system:validate

      - name: Verify system dist is up to date
        run: pnpm run system:verify

  tokens:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tokens dist is up to date
        run: pnpm run tokens:verify

  config:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify config editor artifacts are up to date
        run: pnpm run config:verify

  core:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build markdown
        run: pnpm run markdown:build

      - name: Typecheck core
        run: pnpm run core:typecheck

      - name: Test core
        run: pnpm run core:test

      - name: Build core
        run: pnpm run core:build

  react:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build markdown
        run: pnpm run markdown:build

      - name: Build core
        run: pnpm run core:build

      - name: Typecheck react
        run: pnpm run react:typecheck

      - name: Test react
        run: pnpm run react:test

      - name: Build react
        run: pnpm run react:build

      - name: Verify react adapter is up to date
        run: pnpm run react:verify

  markdown:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck markdown
        run: pnpm run markdown:typecheck

      - name: Test markdown
        run: pnpm run markdown:test

      - name: Build markdown
        run: pnpm run markdown:build

  storybook:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Install Playwright Chromium
        run: pnpm --filter @monospaced/set-storybook exec playwright install --with-deps chromium

      - name: Test core a11y
        run: pnpm run storybook:test

  documentation:
    runs-on: ubuntu-latest
    needs: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare documentation build inputs
        run: pnpm run documentation:prepare

      - name: Typecheck documentation
        run: pnpm run documentation:typecheck

      - name: Build documentation
        run: pnpm --filter @monospaced/set-documentation run build:eleventy
